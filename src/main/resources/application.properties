spring.application.name=baozi-store
server.port=8080

# Banco relacional H2 gravado em arquivo (./data/baozistore.mv.db) - os dados persistem entre execucoes
spring.datasource.url=jdbc:h2:file:./data/baozistore
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate: cria e atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/baozistore, usuario: sa, senha vazia)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Desliga o Open Session in View (as relacoes do Pedido ja sao carregadas junto)
spring.jpa.open-in-view=false
